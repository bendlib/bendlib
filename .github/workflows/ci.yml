name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun tools/install-bend.ts
      - run: sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bendlib
          key: bendlib-${{ hashFiles('toolchain.json') }}
      - run: bun test tools/

  gates:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun tools/install-bend.ts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bendlib
          key: bendlib-${{ hashFiles('toolchain.json') }}
      - run: bun tools/comments.ts
      - run: bun tools/mathlib/check.ts packages/bend-mathlib
      - run: bun tools/mathlib/lint.ts packages/bend-mathlib --erasure
      - run: bun tools/mathlib/twins.ts packages/bend-mathlib --check
      - name: check the kernel package (bend --check-only)
        run: bun tools/mathlib/check.ts packages/bendlib-kernel-list
      - name: lint the kernel package
        run: bun tools/mathlib/lint.ts packages/bendlib-kernel-list --kernel --erasure
      - run: bun tools/mathlib/twins.ts packages/bendlib-kernel-list --check
      - run: bun tools/mathlib/lock.ts packages/bend-mathlib --check
      - name: lock trust anchor (published entries vs the newest bend-mathlib tag)
        run: |
          tag=$(git describe --tags --match 'bend-mathlib-v*' --abbrev=0 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "no bend-mathlib-v* tag yet; skipping --against"
          else
            bun tools/mathlib/lock.ts packages/bend-mathlib --check --against "$tag"
          fi
      - name: index check (version from RELEASES.md)
        run: |
          v=$(awk -F'|' '/bend-mathlib/{v=$3} END{gsub(/ /,"",v);print v}' RELEASES.md)
          bun tools/mathlib/index.ts packages/bend-mathlib bend-mathlib "$v" --check

  lawcheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [nat, list, equal, bool, all]
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun tools/install-bend.ts
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/bendlib
          key: bendlib-${{ hashFiles('toolchain.json') }}
      - name: lawcheck stamp ${{ matrix.module }} (lookup)
        id: stamp
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lawcheck-stamp
          key: lawcheck-${{ matrix.module }}-${{ hashFiles('packages/bend-mathlib/**','tools/lawcheck/**','tools/reader/**','toolchain.json') }}
          lookup-only: true
      - name: lawcheck ${{ matrix.module }}
        if: steps.stamp.outputs.cache-hit != 'true'
        run: bun tools/lawcheck/cli.ts packages/bend-mathlib/${{ matrix.module }}.bend --max-instances 100 --strict --allow-skip eq_true_of_ne_false,cong2,subst,le_total,le_total_d
      - name: stamp lawcheck ${{ matrix.module }}
        if: steps.stamp.outputs.cache-hit != 'true'
        run: touch .lawcheck-stamp
      - name: save lawcheck stamp ${{ matrix.module }}
        if: steps.stamp.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lawcheck-stamp
          key: lawcheck-${{ matrix.module }}-${{ hashFiles('packages/bend-mathlib/**','tools/lawcheck/**','tools/reader/**','toolchain.json') }}

  latest-compiler:
    # Early warning only: the newest Bend release against our sources.
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      BEND_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: curl -fsSL https://bend-lang.com/install.sh | sh
      - name: pin toolchain.json to the installed release
        run: |
          v=$($HOME/.bend/bin/bend version | cut -d' ' -f2)
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"$v\"/" toolchain.json
      - run: bun tools/mathlib/check.ts packages/bend-mathlib
      - run: bun test tools/reader tools/lawcheck
      - run: bun tools/lawcheck/cli.ts packages/bend-mathlib/nat.bend --max-instances 50 --strict --allow-skip eq_true_of_ne_false,cong2,subst,le_total,le_total_d
      - name: F-fact regression (research/experiments/run.sh)
        run: bash research/experiments/run.sh
      - name: open or update the nightly failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          v=$($HOME/.bend/bin/bend version | cut -d' ' -f2)
          t="nightly: bend $v breaks bendlib"
          n=$(gh issue list --state open --search "in:title \"$t\"" --json number --jq '.[0].number')
          if [ -n "$n" ] && [ "$n" != "null" ]; then
            gh issue comment "$n" --body "$RUN_URL"
          else
            gh issue create --title "$t" --body "$RUN_URL"
          fi
